name: Build and Publish Docker Image

on:
  push:
    tags:
      - 'scanhead/*'   # e.g. scanhead/1.0.0 (X.X.X only, no v prefix)
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt
        working-directory: app

      - name: Run tests
        run: python -m pytest
        working-directory: app

  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate PR has version information
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if echo "$PR_TITLE $PR_BODY" | grep -qiE '(version|[0-9]+\.[0-9]+\.[0-9]+|semver|release|deps|bump)'; then
            echo "✓ PR contains version information"
            exit 0
          fi

          if git tag --merged HEAD | grep -qE '^scanhead/[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "✓ Found version tags in branch history"
            exit 0
          fi

          echo "::warning::PR does not appear to include version information"
          echo "::notice::For releases, include version info in the PR title or description"
          echo "::notice::Example: 'Release 1.0.0' or tag scanhead/1.0.0 after merge"
          exit 0

  docker-verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: ./app
          file: ./app/Dockerfile
          push: false

  resolve-tag:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - name: Parse and validate release tag
        id: parse
        run: |
          TAG_REF="${{ github.ref_name }}"

          if [[ "$TAG_REF" != scanhead/* ]] || [[ "$TAG_REF" == *"/v"* ]]; then
            echo "::error::Tag '$TAG_REF' must be 'scanhead/<version>' (e.g. scanhead/1.2.3). Use X.X.X only, no 'v' prefix."
            exit 1
          fi

          VERSION="${TAG_REF#scanhead/}"

          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "::error::Version '$VERSION' is not valid semver (e.g. 1.0.0, 1.0.0-beta.1)."
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release tag resolves to version=${VERSION}"

  build-and-push:
    needs: [ci, resolve-tag]
    if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.resolve-tag.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ensure Docker Hub credentials are set
        run: |
          if [ -z "${{ vars.DOCKER_HUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKER_HUB_TOKEN }}" ]; then
            echo "::error::Set repository variable DOCKER_HUB_USERNAME and secret DOCKER_HUB_TOKEN."
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Check if tag is on main branch
        run: |
          git fetch origin main || true
          TAG_COMMIT="$(git rev-parse HEAD)"
          if git show-ref --verify --quiet refs/remotes/origin/main && git merge-base --is-ancestor "${TAG_COMMIT}" origin/main 2>/dev/null; then
            echo "IS_MAIN_BRANCH=true" >> $GITHUB_ENV
            echo "Tag commit is on main - image will be tagged as 'latest' (if stable)"
          else
            echo "IS_MAIN_BRANCH=false" >> $GITHUB_ENV
            echo "Tag commit is not on main - image will be tagged as 'beta'"
          fi

      - name: Set image names and tags
        env:
          DOCKER_HUB_USERNAME: ${{ vars.DOCKER_HUB_USERNAME }}
        run: |
          IMAGE_NAME="${{ vars.IMAGE_NAME }}"
          [ -z "${IMAGE_NAME}" ] && IMAGE_NAME="scanhead"

          IMAGE="${DOCKER_HUB_USERNAME}/${IMAGE_NAME}"
          echo "IMAGE=${IMAGE}" >> $GITHUB_ENV

          TAGS="${IMAGE}:${VERSION}"

          IS_MAIN="${{ env.IS_MAIN_BRANCH }}"
          if [ "${IS_MAIN}" = "true" ] && [[ ! "$VERSION" =~ - ]]; then
            TAGS="${TAGS}"$'\n'"${IMAGE}:latest"
            echo "Tag on main, stable release - will also tag as 'latest'"
          elif [ "${IS_MAIN}" = "false" ]; then
            TAGS="${TAGS}"$'\n'"${IMAGE}:beta"
            echo "Tag not on main - will also tag as 'beta'"
          else
            echo "Pre-release on main - will not tag as 'latest'"
          fi

          echo "TAGS<<EOF" >> $GITHUB_ENV
          echo "$TAGS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: ${{ env.TAGS }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - name: Update Docker Hub repository description
        env:
          DOCKER_HUB_USERNAME: ${{ vars.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: |
          DESCRIPTION_FILE="./docker-descriptions/app.md"
          if [ ! -f "$DESCRIPTION_FILE" ]; then
            echo "Warning: Description file not found: $DESCRIPTION_FILE"
            exit 0
          fi

          TOKEN=$(curl -s -H "Content-Type: application/json" -X POST \
            -d "{\"username\": \"${DOCKER_HUB_USERNAME}\", \"password\": \"${DOCKER_HUB_TOKEN}\"}" \
            https://hub.docker.com/v2/users/login/ | jq -r .token)

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Error: Failed to authenticate with Docker Hub API"
            exit 1
          fi

          REPO_NAME=$(echo "${{ env.IMAGE }}" | cut -d'/' -f2)
          DESCRIPTION_JSON=$(jq -Rs . < "$DESCRIPTION_FILE")
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X PATCH \
            -H "Authorization: JWT ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"full_description\": ${DESCRIPTION_JSON}}" \
            "https://hub.docker.com/v2/repositories/${DOCKER_HUB_USERNAME}/${REPO_NAME}/")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✓ Updated description for ${DOCKER_HUB_USERNAME}/${REPO_NAME}"
          else
            echo "✗ Failed to update ${DOCKER_HUB_USERNAME}/${REPO_NAME} (HTTP ${HTTP_CODE})"
          fi
