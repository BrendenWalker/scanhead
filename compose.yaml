name: scanhead

# Host networking is required on Linux. The scanner's RTP uses dynamic UDP
# ports; Docker bridge NAT commonly breaks that. MediaMTX can fall back to
# RTSP interleaved TCP (rtspTransport: tcp in mediamtx.yml) if needed.
#
# Local build:
#   SCANNER_IP=192.168.x.x docker compose up --build
#
# Published image (see portainer-stack.yml for Portainer):
#   IMAGE_TAG=latest docker compose pull
#   SCANNER_IP=192.168.x.x docker compose up -d
#
# Do not run Siren, ProScan, or RH-536HP at the same time. ScanHead is the
# only PSI subscriber and the only RTSP client of the scanner.

services:
  mediamtx:
    image: bluenviron/mediamtx:${MEDIAMTX_TAG:-1-ffmpeg}
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    environment:
      # Uniden OPTIONS 400s if the URL host is a DNS name; use a dotted-quad.
      MTX_PATHS_RAW_SOURCE: rtsp://${SCANNER_RTSP_IP:-${SCANNER_IP:?set SCANNER_IP in .env}}/au:scanner.au
      MTX_PATHS_RAW_RUNONAVAILABLE: "ffmpeg -hide_banner -loglevel warning -rtsp_transport tcp -i rtsp://127.0.0.1:8554/raw -af highpass=f=${AUDIO_HIGHPASS_HZ:-200},agate=threshold=${AUDIO_GATE_THRESHOLD:-0.01}:ratio=${AUDIO_GATE_RATIO:-10}:attack=${AUDIO_GATE_ATTACK_MS:-5}:release=${AUDIO_GATE_RELEASE_MS:-150}:range=${AUDIO_GATE_RANGE:-0.002},acompressor=threshold=${AUDIO_COMP_THRESHOLD:-0.1}:ratio=${AUDIO_COMP_RATIO:-6}:attack=${AUDIO_COMP_ATTACK_MS:-10}:release=${AUDIO_COMP_RELEASE_MS:-200}:makeup=${AUDIO_COMP_MAKEUP:-4} -ac 1 -ar 8000 -c:a pcm_mulaw -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:8554/scanner"
      MTX_PATHS_RAW_RUNONAVAILABLERESTART: "yes"

  app:
    image: ${DOCKER_HUB_REGISTRY_USERNAME:-derpmhichurp}/${DOCKER_HUB_IMAGE_NAME:-scanhead}:${IMAGE_TAG:-latest}
    build: ./app
    network_mode: host
    restart: unless-stopped
    depends_on:
      - mediamtx
    environment:
      SCANNER_IP: ${SCANNER_IP:?set SCANNER_IP in .env}
      SCANNER_PORT: ${SCANNER_PORT:-50536}
      APP_PORT: ${APP_PORT:-8080}
      PSI_INTERVAL_MS: ${PSI_INTERVAL_MS:-500}
      MEDIAMTX_WHEP_PORT: ${MEDIAMTX_WHEP_PORT:-8889}
      MEDIAMTX_HLS_PORT: ${MEDIAMTX_HLS_PORT:-8888}
      MEDIAMTX_RTSP_PORT: ${MEDIAMTX_RTSP_PORT:-8554}
